[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "projeto-eventos-django"
version = "1.0.0"
description = "API REST com Django para gestao de eventos"
requires-python = ">=3.10"
dependencies = [
    "django>=5.1.0",
    "djangorestframework>=3.15.0",
    "djangorestframework-simplejwt>=5.3.0",
    "django-cors-headers>=4.3.0",
    "python-dotenv>=1.0.0",
    "psycopg2-binary>=2.9.0",
    "bcrypt>=4.0.0",
    "pyjwt>=2.9.0",
]

[tool.setuptools]
packages = ["api", "config", "core"]